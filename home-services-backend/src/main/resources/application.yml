server:
  port: ${PORT:8080}
  
resend:
  api-key: ${EMAIL_API_KEY}
  
spring:
  profiles:
    active: prod

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  ai:
    groq:
      api-key: ${GROK_API_KEY}   # ✅ secure
      base-url: https://api.groq.com/openai/v1

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    org.springframework.security: DEBUG
    com.homeservices: DEBUG
    
vapid:
  public-key: ${PUSH_PUBLIC_KEY}
  private-key: ${PUSH_PRIVATE_KEY}
  subject: ${PUSH_SUBJECT}
  
msg91:
  auth-key: ${MSG_AUTH_KEY}
  sender-id: ${MSG_SENDER_ID}
  template-id: ${MSG_TEMPLATE_ID}
  
cashfree:
  app-id: ${CASHFREE_APP_ID}
  secret-key: ${CASHFREE_SECRET_KEY}
  api-url: ${CASHFREE_API_URL}   # prod; use https://sandbox.cashfree.com/pg for test

app:
  frontend-url: ${FRONTEND_URL:https://snowiness-revenue-outline.ngrok-free.dev}
